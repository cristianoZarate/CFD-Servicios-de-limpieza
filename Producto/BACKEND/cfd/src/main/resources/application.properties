spring.application.name=cfd

# ── BASE DE DATOS ────────────────────────────────────────────────────
#
# MYSQLHOST     → Railway lo provee (ej: roundhouse.proxy.rlwy.net)
#                 Default local: localhost
#
# MYSQLPORT     → Railway lo provee (ej: 23439)
#                 Default local: 3306
#
# MYSQLDATABASE → Railway lo provee como "railway"
#                 XAMPP local. Ahora el default es "cfd_servicios".
#
# MYSQLUSER     → Railway lo provee como "root"
#                 Default local: root
#
# MYSQLPASSWORD → Railway lo provee con la contraseña real
#                 Default local: vacío (XAMPP no usa contraseña)

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:cfd_servicios}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

# ── JPA / HIBERNATE ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true